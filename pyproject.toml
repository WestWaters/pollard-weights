[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pollard-weights"
version = "1.3.0"
description = "Know what your hardware can do with any model BEFORE you download it — byte-economics calculator + measurement harnesses for running frontier models on small hardware."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "quantization", "moe", "inference", "edge", "gguf", "memory-bandwidth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core stays light: the calculator (pollard-calc) is pure stdlib; gguf+numpy cover the GGUF/imatrix path.
# Heavy, lane-specific deps are lazy-imported and live in the extras below (each tool errors clearly if
# its extra isn't installed). Install what you need, e.g.  pip install "pollard-weights[exl3]".
dependencies = [
    "numpy",
    "gguf",
]

[project.optional-dependencies]
convert = ["torch", "transformers", "safetensors", "datasets"]     # measure/precondition/verify/probe/sensitivity/calib
gptq = ["torch", "transformers", "safetensors", "gptqmodel", "datasets"]   # pollard-export (vLLM/SGLang GPTQ lane)
charts = ["matplotlib"]                                             # pollard-eval --chart / experiments/plot_*.py
exl3 = ["torch", "transformers", "safetensors", "exllamav3", "datasets"]
mlx = ["mlx-lm"]
mx = ["torch", "transformers", "llmcompressor", "datasets"]
hf = ["huggingface-hub", "hf-transfer"]                            # publishing to the Hub
all = ["torch", "transformers", "safetensors", "exllamav3", "datasets", "gptqmodel",
       "mlx-lm", "llmcompressor", "huggingface-hub", "hf-transfer", "matplotlib"]

[project.scripts]
pollard = "pollard_auto:main"
pollard-calc = "pollard_calc:main"
pollard-fit = "pollard_fit:main"
pollard-run = "pollard_run:main"
pollard-fit-dit = "pollard_fit_dit:main"
pollard-experts = "pollard_experts:main"
pollard-sensitivity = "pollard_sensitivity:main"
pollard-smooth = "pollard_smooth:main"
pollard-rotate = "pollard_rotate:main"
pollard-precondition = "pollard_precondition:main"
pollard-eval = "pollard_eval:main"
pollard-health = "pollard_health:main"
pollard-pack = "pollard_pack:main"
pollard-prune = "pollard_prune:main"
pollard-bench = "pollard_bench:main"
pollard-export = "pollard_export:main"
pollard-gptq = "pollard_gptq:main"
pollard-automap = "pollard_automap:main"
pollard-abliterate = "pollard_abliterate:main"
pollard-probe = "pollard_probe:main"
pollard-probes = "pollard_probes:main"
pollard-scorecard = "pollard_scorecard:main"
pollard-kl = "pollard_kl:main"
pollard-lowbit = "pollard_lowbit:main"
pollard-verify = "pollard_verify:main"
pollard-doctor = "pollard_doctor:main"
pollard-errsrc = "pollard_errsrc:main"
pollard-archfp = "pollard_archfp:main"
pollard-errtype = "pollard_errtype:main"
pollard-ls = "pollard_ls:main"
pollard-hf-smooth = "pollard_hf_smooth:main"
pollard-mx = "pollard_mx:main"
pollard-mlx = "pollard_mlx:main"
pollard-exl3 = "pollard_exl3:main"
pollard-calib = "pollard_calib:main"
pollard-palette = "pollard_palette:main"
pollard-serve-eval = "pollard_serve_eval:main"
pollard-card = "pollard_card:main"
pollard-ggufcheck = "pollard_ggufcompat:main"
pollard-reclaim = "pollard_reclaim:main"
pollard-recard = "pollard_recard:main"
pollard-onboard = "pollard_onboard:main"
pollard-envmatch = "pollard_envmatch:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["pollard_auto", "pollard_calc", "pollard_fit", "pollard_run", "pollard_fit_dit", "pollard_experts", "pollard_sensitivity", "pollard_smooth", "pollard_rotate", "pollard_precondition", "pollard_eval", "pollard_health", "pollard_pack", "pollard_prune", "pollard_bench", "pollard_export", "pollard_gptq", "pollard_automap", "pollard_abliterate", "pollard_probe", "pollard_probes", "pollard_scorecard", "pollard_kl", "pollard_lowbit", "pollard_verify", "pollard_doctor", "pollard_hf_smooth", "pollard_mx", "pollard_mlx", "pollard_exl3", "pollard_calib", "pollard_palette", "pollard_ls", "pollard_workspace",
    "pollard_serve_eval", "pollard_card", "pollard_onboard", "pollard_envmatch", "imatrix_fix_gate", "exl3_fix_mtp_ehproj",
    "pollard_archfp", "pollard_errtype", "pollard_errsrc", "pollard_recard",
    "pollard_ggufcompat", "pollard_reclaim"]
