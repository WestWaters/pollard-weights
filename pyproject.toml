[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pollard-weights"
version = "0.2.0-dev"
description = "Know what your hardware can do with any model BEFORE you download it — byte-economics calculator + measurement harnesses for running frontier models on small hardware."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "quantization", "moe", "inference", "edge", "gguf", "memory-bandwidth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
pollard-calc = "pollard_calc:main"
pollard-fit = "pollard_fit:main"
pollard-run = "pollard_run:main"
pollard-fit-dit = "pollard_fit_dit:main"
pollard-experts = "pollard_experts:main"
pollard-sensitivity = "pollard_sensitivity:main"
pollard-smooth = "pollard_smooth:main"
pollard-rotate = "pollard_rotate:main"
pollard-precondition = "pollard_precondition:main"
pollard-eval = "pollard_eval:main"
pollard-health = "pollard_health:main"
pollard-pack = "pollard_pack:main"
pollard-export = "pollard_export:main"
pollard-gptq = "pollard_gptq:main"
pollard-automap = "pollard_automap:main"
pollard-abliterate = "pollard_abliterate:main"
pollard-probe = "pollard_probe:main"
pollard-scorecard = "pollard_scorecard:main"
pollard-kl = "pollard_kl:main"
pollard-lowbit = "pollard_lowbit:main"
pollard-palette = "pollard_palette:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["pollard_calc", "pollard_fit", "pollard_run", "pollard_fit_dit", "pollard_experts", "pollard_sensitivity", "pollard_smooth", "pollard_rotate", "pollard_precondition", "pollard_eval", "pollard_pack", "pollard_export", "pollard_gptq", "pollard_automap"]
